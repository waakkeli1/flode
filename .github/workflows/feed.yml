name: Päivitä feed ja julkaise

on:
  schedule:
    - cron: "17 */4 * * *"   # 4 tunnin välein
  workflow_dispatch:          # käsin: Actions › Päivitä feed ja julkaise › Run workflow
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna tekstityshaku
        run: pip install youtube-transcript-api || echo "Asennus epäonnistui, jatketaan ilman tekstityksiä"

      - name: Rakenna feed.json
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python scripts/build_feed.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
